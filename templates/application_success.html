
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted | EmployLink</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f2f5fb;
            color: #17233c;
        }

        .success-card {
            width: 100%;
            max-width: 480px;
            background: white;
            text-align: center;
            padding: 40px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 35px #17233c12;
        }

        .check {
            display: grid;
            place-items: center;
            width: 78px;
            height: 78px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            font-size: 40px;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #748098;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="check">✓</div>
        <h1>Application Submitted!</h1>
        <p>
            Thank you for applying through EmployLink.
            Your application has been recorded.
        </p>
        <a href="/jobs">Explore More Jobs</a>
    </div>
</body>
</html>
